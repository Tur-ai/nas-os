[global]
   workgroup = WORKGROUP
   server string = NAS-OS
   security = user
   map to guest = Bad User
   log file = /var/log/samba/log.%m
   max log size = 1000

[public]
   path = /srv/nas/public
   browseable = yes
   read only = no
   guest ok = yes
   force group = nasusers
   create mask = 0664
   directory mask = 2775

[private]
   path = /srv/nas/private
   browseable = yes
   read only = no
   valid users = @nasusers
   create mask = 0660
   directory mask = 2770
