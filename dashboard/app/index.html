<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAS-OS Control Deck</title>
<style>
:root{--bg:#070914;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--tx:#e8ecff;--mut:#8b93b8;--c1:#22d3ee;--c2:#a78bfa;--c3:#f472b6;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.34;animation:float 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--c1);top:-25vmax;left:-15vmax}
.aurora i:nth-child(2){background:var(--c2);right:-20vmax;top:10vmax;animation-delay:-8s}
.aurora i:nth-child(3){background:var(--c3);bottom:-30vmax;left:20vmax;opacity:.2;animation-delay:-14s}
@keyframes float{to{transform:translate(6vmax,4vmax) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);opacity:.4}
main{max-width:1240px;margin:auto;padding:28px 20px 40px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.logo{display:flex;gap:14px;align-items:center}
.logo b{font-size:30px;letter-spacing:.05em;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;color:var(--mut);font-size:11px;letter-spacing:.24em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:13px;color:var(--mut)}
.chip b{color:var(--tx);font-weight:600;font-family:ui-monospace,Consolas,monospace}
.row{display:grid;gap:18px}
.r4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.r2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{padding:20px;border:1px solid var(--line);border-radius:22px;background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 10px 40px #0006,inset 0 1px 0 #ffffff14}
.card h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;justify-content:space-between;font-weight:600}
.gauge{display:flex;align-items:center;gap:16px}
.gauge svg{width:112px;height:112px;transform:rotate(-90deg);flex:none}
.gauge circle{fill:none;stroke-width:10;stroke-linecap:round}
.gauge .bg{stroke:#ffffff14}
.gauge .fg{stroke:var(--c1);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1s cubic-bezier(.3,.7,.2,1),stroke .5s}
.big{font:700 34px ui-monospace,Consolas,monospace}
.sub{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:9px;background:#ffffff14;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width 1s}
.dl{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.dl span:first-child{color:var(--mut)}
.dl+.dl{margin-top:9px}
canvas{width:100%;height:170px;display:block}
.legend{display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--mut)}
.legend b{font-family:ui-monospace,Consolas,monospace;color:var(--tx)}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.svc{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:#ffffff0a;border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok);animation:pulse 2s infinite}
.dot.off{background:var(--bad);box-shadow:0 0 10px var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #34d39988}70%,100%{box-shadow:0 0 0 9px #0000}}
.svc span{font-size:12px;color:var(--mut);display:block}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.links a{color:var(--tx);text-decoration:none;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,#22d3ee22,#a78bfa22);font-size:14px;transition:.2s}
.links a:hover{transform:translateY(-2px);border-color:var(--c1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="grid-bg"></div>
<main>
<header>
  <div class="logo">
    <svg width="46" height="46" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
      <rect x="4" y="6" width="36" height="9" rx="3" fill="none" stroke="url(#lg)" stroke-width="2.5"/><rect x="4" y="18" width="36" height="9" rx="3" fill="none" stroke="url(#lg)" stroke-width="2.5"/><rect x="4" y="30" width="36" height="9" rx="3" fill="none" stroke="url(#lg)" stroke-width="2.5"/>
      <circle cx="33" cy="10.5" r="1.8" fill="#22d3ee"/><circle cx="33" cy="22.5" r="1.8" fill="#a78bfa"/><circle cx="33" cy="34.5" r="1.8" fill="#f472b6"/></svg>
    <div><b>NAS-OS</b><small>Control Deck</small></div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<section class="row r4">
  <div class="card"><h3>CPU <span id="cores"></span></h3>
    <div class="gauge"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="g-cpu" cx="60" cy="60" r="52"/></svg>
    <div><div class="big" id="v-cpu">0%</div><div class="sub" id="s-cpu"></div></div></div></div>
  <div class="card"><h3>RAM <span id="swap"></span></h3>
    <div class="gauge"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="g-ram" cx="60" cy="60" r="52"/></svg>
    <div><div class="big" id="v-ram">0%</div><div class="sub" id="s-ram"></div></div></div></div>
  <div class="card"><h3>Penyimpanan</h3><div id="disks"></div></div>
  <div class="card"><h3>Sistem</h3><div id="sys"></div></div>
</section>

<section class="row r2">
  <div class="card"><h3>Lalu lintas jaringan <span>60 detik terakhir</span></h3><canvas id="cv"></canvas>
    <div class="legend"><span style="color:#22d3ee">▼ Unduh <b id="rx">0</b></span><span style="color:#f472b6">▲ Unggah <b id="tx">0</b></span></div></div>
  <div class="card"><h3>Layanan</h3><div class="svcs" id="svcs"></div>
    <div class="links" id="links"></div></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gb=b=>b>=2**40?(b/2**40).toFixed(2)+" TB":b>=2**30?(b/2**30).toFixed(1)+" GB":(b/2**20).toFixed(0)+" MB";
const rate=b=>b>=2**20?(b/2**20).toFixed(1)+" MB/s":(b/1024).toFixed(0)+" KB/s";
const col=p=>p<60?"#22d3ee":p<85?"#fbbf24":"#fb7185";
const dur=s=>{s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+"h ":"")+h+"j "+m+"m"};

function ring(id,p){const e=$("g-"+id);e.style.strokeDashoffset=326.7*(1-p/100);e.style.stroke=col(p);e.style.filter="drop-shadow(0 0 6px "+col(p)+")"}

function draw(rx,tx){
  const c=$("cv"),r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*r;c.height=h*r;const x=c.getContext("2d");x.scale(r,r);
  const mx=Math.max(10240,...rx,...tx)*1.2,st=w/59,y=v=>h-4-(v/mx)*(h-14);
  x.strokeStyle="#ffffff12";x.lineWidth=1;
  for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
  [[rx,"#22d3ee"],[tx,"#f472b6"]].forEach(([a,k])=>{
    if(a.length<2)return;const x0=w-(a.length-1)*st;
    x.beginPath();a.forEach((v,i)=>{const px=x0+i*st;i?x.lineTo(px,y(v)):x.moveTo(px,y(v))});
    x.strokeStyle=k;x.lineWidth=2;x.shadowColor=k;x.shadowBlur=10;x.stroke();x.shadowBlur=0;
    x.lineTo(w,h);x.lineTo(x0,h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,k+"44");g.addColorStop(1,k+"00");x.fillStyle=g;x.fill();
  });
}

function render(d){
  $("chips").innerHTML=[["Host",d.host],["IP",d.ip],["OS",d.os],["Kernel",d.kernel],["Uptime",dur(d.uptime)]]
    .map(([k,v])=>`<span class="chip">${k} <b>${esc(v)}</b></span>`).join("");
  $("cores").textContent=d.cores+" core";
  $("v-cpu").textContent=Math.round(d.cpu)+"%";ring("cpu",d.cpu);
  $("s-cpu").textContent="Load "+d.load.map(v=>v.toFixed(2)).join(" · ");
  const rp=100*d.mem.used/d.mem.total;
  $("v-ram").textContent=Math.round(rp)+"%";ring("ram",rp);
  $("s-ram").textContent=gb(d.mem.used)+" / "+gb(d.mem.total);
  $("swap").textContent=d.mem.swap_total?"swap "+gb(d.mem.swap_used):"tanpa swap";
  const nm={"/":"Sistem","/srv/nas":"Data NAS"};
  $("disks").innerHTML=d.disks.map(k=>{const p=100*k.used/k.total;
    return `<div class="dl"><span>${nm[k.path]||esc(k.path)}</span><span>${gb(k.used)} / ${gb(k.total)}</span></div><div class="bar"><i style="width:${p}%"></i></div>`}).join("");
  const b=d.backup;
  $("sys").innerHTML=`<div class="dl"><span>Suhu</span><span>${d.temp!==null?d.temp+" °C":"tidak tersedia"}</span></div>
    <div class="dl"><span>Backup terakhir</span><span>${b?esc(b.name):"belum ada"}</span></div>
    <div class="dl"><span>Jumlah snapshot</span><span>${b?b.count:0}</span></div>
    <div class="dl"><span>Samba</span><span>\\\\${esc(d.host)}\\public</span></div>`;
  $("rx").textContent=rate(d.net.rx);$("tx").textContent=rate(d.net.tx);
  draw(d.hist.rx,d.hist.tx);
  $("svcs").innerHTML=d.services.map(s=>{const on=s.state==="active";
    return `<div class="svc"><i class="dot ${on?"on":s.state==="unknown"?"":"off"}"></i><div>${esc(s.name)}<span>${on?"aktif":esc(s.state)}</span></div></div>`}).join("");
}
$("links").innerHTML=`<a href="http://${location.hostname}:8096">Jellyfin ↗</a><a href="https://${location.hostname}:9090">Cockpit (admin) ↗</a>`;

async function tick(){
  try{render(await(await fetch("/api/stats",{cache:"no-store"})).json())}
  catch(e){$("chips").innerHTML='<span class="chip"><b style="color:#fb7185">Terputus dari server</b></span>'}
}
tick();setInterval(tick,2000);
</script>
</body>
</html>
